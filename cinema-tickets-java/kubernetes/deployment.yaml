apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinema-tickets
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cinema-tickets
  template:
    metadata:
      labels:
        app: cinema-tickets
    spec:
      containers:
        - name: cinema-tickets
          image: your-dockerhub-username/cinema-tickets:latest
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: cinema-tickets-service
spec:
  selector:
    app: cinema-tickets
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinema-tickets-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: cinema.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cinema-tickets-service
                port:
                  number: 80
 
---
apiVersion: v1
kind: Secret
metadata:
  name: ticket-service-secrets
type: Opaque
data:
  DB_USER: dGlja2V0X3VzZXI=   # base64 of ticket_user
  DB_PASS: dGlja2V0X3Bhc3M=   # base64 of ticket_pass
  REDIS_PASS: cmVkaXNfcGFzcw== # base64 of redis_pass
  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticket-service-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  REDIS_HOST: "redis"
  DB_HOST: "postgres"
  DB_PORT: "5432"